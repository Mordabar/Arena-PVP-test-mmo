<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Custodia de almas"><title>Custodia de almas</title><desc>El brujo debilita al objetivo y le drena salud añadiéndolo a su propia reserva. No puede drenar más puntos de los que le falta a su propia salud o más de los que tiene el objetivo. No puede ser usado en criaturas. — Necromancy #7</desc><defs><radialGradient id="bg" cx="35%" cy="24%" r="85%"><stop stop-color="#c596ff" stop-opacity=".5"/><stop offset=".5" stop-color="#20202e"/><stop offset="1" stop-color="#090d15"/></radialGradient><linearGradient id="ink" x2=".7" y2="1"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#c596ff"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="8" fill="url(#bg)" stroke="#c596ff" stroke-opacity=".55"/><g fill="none" color="#c596ff" stroke="url(#ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 51V29q0-19 18-19 18 0 18 19v22l-10-6-8 9-8-9Z M24 26v8M40 26v8M27 41h10"/></g><g transform="translate(51 49)"><circle r="9" fill="#111522" stroke="#c8b590" stroke-width=".8"/><g stroke="#f7f2dd" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle r="5"/><path d="M0-3v3h3"/></g></g><rect x="3" y="56" width="26.7" height="2" rx="1" fill="#c596ff" opacity=".8"/><text x="7" y="53" fill="#c596ff" font-family="sans-serif" font-size="7" font-weight="bold">7</text></svg>