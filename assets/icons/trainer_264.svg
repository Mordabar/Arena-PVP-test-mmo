<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hambre de sangre"><title>Hambre de sangre</title><desc>El bárbaro descarga toda su furia. Sus ataques normales ganan una bonificación que se incrementa por cada impacto exitoso que produce. Se agota al completar su duración o al realizar 5 ataques exitosos. Ataques evadidos o bloqueados no reducen el conteo. — Warcries #4</desc><defs><radialGradient id="bg" cx="35%" cy="24%" r="85%"><stop stop-color="#ebd7b6" stop-opacity=".5"/><stop offset=".5" stop-color="#20202e"/><stop offset="1" stop-color="#090d15"/></radialGradient><linearGradient id="ink" x2=".7" y2="1"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#ebd7b6"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="8" fill="url(#bg)" stroke="#ebd7b6" stroke-opacity=".55"/><g fill="none" color="#ebd7b6" stroke="url(#ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24q20-13 40 0l-6 24-9-15-5 10-6-10-8 15Z M14 24l12 8M50 24l-13 8"/></g><g transform="translate(51 49)"><circle r="9" fill="#111522" stroke="#c8b590" stroke-width=".8"/><g stroke="#f7f2dd" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M-5-5l5 5-5 5M0-5l5 5-5 5"/></g></g><rect x="3" y="56" width="17.4" height="2" rx="1" fill="#ebd7b6" opacity=".8"/><text x="7" y="53" fill="#ebd7b6" font-family="sans-serif" font-size="7" font-weight="bold">4</text></svg>