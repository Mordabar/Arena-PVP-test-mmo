<!doctype html><meta charset=utf-8><body style="margin:0;background:#101418"><canvas id=c></canvas>
<script>
const BONES=[['pelvis','spine_03'],['spine_03','neck_01'],['neck_01','Head'],
['spine_03','upperarm_l'],['upperarm_l','lowerarm_l'],['lowerarm_l','hand_l'],
['spine_03','upperarm_r'],['upperarm_r','lowerarm_r'],['lowerarm_r','hand_r'],
['pelvis','thigh_l'],['thigh_l','calf_l'],['calf_l','foot_l'],
['pelvis','thigh_r'],['thigh_r','calf_r'],['calf_r','foot_r']];
const COL=n=>/_l$/.test(n)?'#6cf':/_r$/.test(n)?'#fa5':'#ddd';
const q=new URLSearchParams(location.search);
const clip=q.get('clip'), idx=(q.get('f')||'0').split(',').map(Number);
fetch('frames.json').then(r=>r.json()).then(F=>{
 const fr=idx.map(i=>F[clip][i]);
 const W=300,H=360,cv=document.getElementById('c');cv.width=W*fr.length;cv.height=H*3;
 const g=cv.getContext('2d');
 // vistas: lado (x=Z hacia la derecha, y=Y), arriba (x=X invertido, y=Z), frontal-desde-atrás (x=-X, y=Y)
 const views=[
  (p)=>[W/2+(p[2]-0.2)*170, H-30-p[1]*190],
  (p)=>[W/2-p[0]*200, H*0.58-(p[2]-0.2)*200],
  (p)=>[W/2-p[0]*170, H-30-p[1]*190]];
 const names=['LADO (derecha=+Z, apunta ->)','ARRIBA (arriba=+Z)','ATRAS (izq.pers = izq.pantalla)'];
 fr.forEach((f,i)=>{views.forEach((v,k)=>{
  const ox=i*W, oy=k*H; g.save(); g.translate(ox,oy); g.beginPath(); g.rect(0,0,W,H); g.clip();
  g.strokeStyle='#223';g.strokeRect(0,0,W,H);
  g.fillStyle='#89a';g.font='11px monospace';g.fillText(names[k]+'  t='+f.t,6,14);
  g.strokeStyle='#345';g.beginPath();
  if(k!=1){const y=H-30-0.0*190;g.moveTo(0,y);g.lineTo(W,y);} g.stroke();
  // flecha +Z (linea de tiro) desde mano arco
  for(const [a,b] of BONES){const A=v(f.joints[a]),Bp=v(f.joints[b]);g.strokeStyle=COL(b);g.lineWidth=3;g.beginPath();g.moveTo(...A);g.lineTo(...Bp);g.stroke();}
  const h=v(f.joints.Head);g.fillStyle='#ddd';g.beginPath();g.arc(h[0],h[1],13,0,7);g.fill();
  const hl=f.joints.hand_l,hr=f.joints.hand_r; // cuerda
  g.strokeStyle='#8f8';g.lineWidth=1.5;g.beginPath();g.moveTo(...v(hl));g.lineTo(...v(hr));g.stroke();
  g.restore();});});
 document.title='listo';
});
</script>
