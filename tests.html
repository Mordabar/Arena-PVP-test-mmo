<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Arena · Pruebas de combate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c1412'/%3E%3Cpath d='M32 12 46 52 32 43 18 52Z' fill='%23e7c678'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 32px 60px;
    background: #0e1116; color: #d7dde5;
    font: 13px/1.65 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  h1 { font-size: 17px; letter-spacing: .18em; text-transform: uppercase; color: #8fa3bb; margin: 0 0 4px; }
  .sub { color: #5d6b7d; margin-bottom: 22px; font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  input, button {
    background: #171c25; color: #d7dde5; border: 1px solid #2a3340;
    padding: 7px 12px; border-radius: 6px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4a5costume; background: #1f2733; }
  .suite { margin: 0 0 18px; border-left: 2px solid #232b36; padding-left: 14px; }
  .suite h2 { font-size: 13px; margin: 0 0 6px; color: #c3cedd; font-weight: 600; }
  .t { padding: 1px 0 1px 18px; position: relative; }
  .t.ok { color: #6f8296; }
  .t.ko { color: #ff8a7a; }
  .t::before { position: absolute; left: 0; }
  .t.ok::before { content: "✓"; color: #4fbf87; }
  .t.ko::before { content: "✗"; color: #ff5a4d; }
  .err { color: #ffb4a8; margin: 3px 0 8px 18px; white-space: pre-wrap; font-size: 12px; }
  .summary { margin-top: 24px; padding: 14px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .summary.ok { background: rgba(79,191,135,.12); border: 1px solid rgba(79,191,135,.4); color: #6fe0aa; }
  .summary.ko { background: rgba(255,90,77,.12); border: 1px solid rgba(255,90,77,.4); color: #ff8a7a; }
</style>
</head>
<body>
<h1>Arena · Combat Lab</h1>
<div class="sub">Batería obligatoria del documento §26 más las reglas de §5, §6, §7, §9, §10 y §11.</div>

<div class="bar">
  <input id="filter" placeholder="filtrar pruebas…" size="28">
  <button id="run">Ejecutar</button>
  <a href="index.html" style="color:#5aa8ff;text-decoration:none;margin-left:8px">← volver al laboratorio</a>
</div>

<div id="out"></div>

<!-- Núcleo de simulación: idéntico orden que index.html -->
<script src="js/namespace.js"></script>
<script src="js/math/vec3.js"></script>
<script src="js/math/mat4.js"></script>
<script src="js/math/ray.js"></script>
<script src="js/core/eventBus.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/core/fixedTick.js"></script>
<script src="js/data/balance.js"></script>
<script src="js/data/effects.js"></script>
<script src="js/core/entity.js"></script>
<script src="js/combat/statusSystem.js"></script>
<script src="js/combat/damageSystem.js"></script>
<script src="js/combat/healingSystem.js"></script>
<script src="js/combat/resolver.js"></script>
<script src="js/combat/abilitySystem.js"></script>
<script src="js/data/races.js"></script>
<script src="js/data/animConfig.js"></script>
<script src="js/data/classes.js"></script>
<script src="js/data/abilities.js"></script>
<script src="js/data/passives.js"></script>
<script src="js/data/castFamilies.js"></script>
<script src="js/data/scenarios.js"></script>
<script src="js/ui/hudModel.js"></script>
<script src="js/anim/animationIntent.js"></script>
<script src="js/product/ladder.js"></script>
<script src="js/product/matchFlow.js"></script>
<script src="js/sim/arena.js"></script>
<script src="js/sim/arenaMetrics.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/ai/dummyAI.js"></script>
<script src="js/render/rendererBackend.js"></script>
<script src="js/render/camera3d.js"></script>
<script src="js/render/anim/skeleton.js"></script>
<script src="js/render/anim/locomotion.js"></script>
<script src="js/render/anim/actions.js"></script>

<!-- Pruebas -->
<script src="js/ui/abilityIcons.js"></script>
<script src="js/tests/testRunner.js"></script>
<script src="js/tests/combatTests.js"></script>
<script src="js/tests/balanceTests.js"></script>
<script src="js/tests/controlTests.js"></script>
<script src="js/tests/animTests.js"></script>
<script src="js/tests/gameFeelMissionTests.js"></script>
<script src="js/tests/animationReferenceTests.js"></script>
<script src="js/tests/productTests.js"></script>
<script src="js/tests/iconTests.js"></script>
<script src="js/tests/arenaTests.js"></script>
<script src="js/tests/presentationTests.js"></script>

<script>
(function () {
  var out = document.getElementById('out');

  function render(results) {
    var html = '';
    for (var i = 0; i < results.suites.length; i++) {
      var s = results.suites[i];
      html += '<div class="suite"><h2>' + s.name + ' — ' + s.passed + '/' + s.tests.length + '</h2>';
      for (var j = 0; j < s.tests.length; j++) {
        var t = s.tests[j];
        html += '<div class="t ' + (t.ok ? 'ok' : 'ko') + '">' + esc(t.name) + '</div>';
        if (!t.ok) html += '<div class="err">→ ' + esc(t.error) + '</div>';
      }
      html += '</div>';
    }
    html += '<div class="summary ' + (results.ok ? 'ok' : 'ko') + '">' +
      (results.ok
        ? 'TODO OK · ' + results.passed + ' pruebas en ' + results.ms + ' ms'
        : 'FALLOS · ' + results.failed + ' de ' + results.total + ' pruebas') + '</div>';
    out.innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  function run() {
    var f = document.getElementById('filter').value.trim();
    var results = Arena.Tests.run(f || null);
    render(results);
    window.__ARENA_TEST_RESULTS__ = results;
  }

  document.getElementById('run').addEventListener('click', run);
  document.getElementById('filter').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') run();
  });
  run();
})();
</script>
</body>
</html>
